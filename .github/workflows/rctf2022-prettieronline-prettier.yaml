name: prettieronline-prettier
on:
  push:
    paths:
      - ./rctf2022/prettieronline/prettier
      - .github/workflows/rctf2022-prettieronline-prettier.yaml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check out code
        uses: actions/checkout@v2
        with:
          lfs: true
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rctf2022-prettieronline-prettier
          context: rctf2022/prettieronline/prettier
          file: ./rctf2022/prettieronline/prettier/Dockerfile
